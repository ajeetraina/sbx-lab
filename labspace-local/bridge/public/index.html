<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local terminal</title>
  <link rel="stylesheet" href="/xterm.css">
  <style>
    :root { --bg: #0b1020; --bar: #141b2e; --tab: #1f2940; --active: #1d63ed; --fg: #e6ebf5; --dim: #8a96b0; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px system-ui, sans-serif; }
    body { display: flex; flex-direction: column; }
    #bar { display: flex; align-items: center; gap: 4px; padding: 6px 8px; background: var(--bar); overflow-x: auto; flex: none; }
    .tab { display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 6px; background: var(--tab); color: var(--dim); cursor: pointer; white-space: nowrap; border: 0; font: inherit; }
    .tab.active { background: var(--active); color: #fff; }
    .tab .x { opacity: .6; padding: 0 2px; }
    .tab .x:hover { opacity: 1; }
    #add { background: transparent; color: var(--dim); border: 1px dashed #3a4664; }
    #status { margin-left: auto; color: var(--dim); white-space: nowrap; padding-left: 8px; }
    #terms { position: relative; flex: 1; min-height: 0; }
    .term { position: absolute; inset: 0; padding: 6px 0 0 8px; display: none; }
    .term.active { display: block; }
  </style>
</head>
<body>
  <div id="bar"><button id="add" class="tab" title="New terminal">+</button><span id="status">connecting…</span></div>
  <div id="terms"></div>
  <script src="/xterm.js"></script>
  <script src="/addon-fit.js"></script>
  <script>
    const bar = document.getElementById("bar");
    const addBtn = document.getElementById("add");
    const status = document.getElementById("status");
    const container = document.getElementById("terms");
    const tabs = new Map(); // id -> { term, fit, el, tabEl }
    let active = null;
    let ws;

    function sendMsg(msg) { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg)); }

    function createTab(id) {
      if (tabs.has(id)) return tabs.get(id);
      const el = document.createElement("div");
      el.className = "term";
      container.appendChild(el);
      const term = new Terminal({
        cursorBlink: true, scrollback: 5000, fontSize: 13,
        fontFamily: 'ui-monospace, "SF Mono", Menlo, Consolas, monospace',
        theme: { background: "#0b1020" },
      });
      const fit = new FitAddon.FitAddon();
      term.loadAddon(fit);
      term.open(el);
      // While old output is replayed, xterm.js answers the terminal queries it contains again:
      // those answers are not for the shell, drop them.
      term.onData((data) => { if (!entry.replaying) sendMsg({ t: "in", id, data }); });

      const tabEl = document.createElement("button");
      tabEl.className = "tab";
      tabEl.innerHTML = `<span></span><span class="x" title="Close">×</span>`;
      tabEl.firstChild.textContent = id;
      tabEl.onclick = (e) => {
        if (e.target.classList.contains("x")) sendMsg({ t: "close", id });
        else focusTab(id);
      };
      bar.insertBefore(tabEl, addBtn);

      const entry = { term, fit, el, tabEl, replaying: false };
      tabs.set(id, entry);
      return entry;
    }

    function removeTab(id) {
      const entry = tabs.get(id);
      if (!entry) return;
      entry.term.dispose();
      entry.el.remove();
      entry.tabEl.remove();
      tabs.delete(id);
      if (active === id) active = null;
    }

    function resize(id) {
      const entry = tabs.get(id);
      if (!entry || id !== active) return;
      entry.fit.fit();
      sendMsg({ t: "resize", id, cols: entry.term.cols, rows: entry.term.rows });
    }

    function focusTab(id) {
      const entry = tabs.get(id);
      if (!entry) return;
      for (const [other, e] of tabs) {
        e.el.classList.toggle("active", other === id);
        e.tabEl.classList.toggle("active", other === id);
      }
      active = id;
      resize(id);
      entry.term.focus();
    }

    addBtn.onclick = () => {
      let n = 2;
      while (tabs.has(`terminal-${n}`)) n++;
      sendMsg({ t: "open", id: `terminal-${n}` });
    };

    function connect() {
      ws = new WebSocket(`ws://${location.host}/ws`);
      ws.onopen = () => { status.textContent = "this machine"; };
      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if (msg.t === "list") {
          for (const id of msg.ids) createTab(id);
          for (const id of [...tabs.keys()]) if (!msg.ids.includes(id)) removeTab(id);
          if (msg.focus && tabs.has(msg.focus)) focusTab(msg.focus);
          else if (!active && msg.ids.length) focusTab(msg.ids[0]);
        } else if (msg.t === "out") {
          const entry = createTab(msg.id);
          if (msg.replay) {
            entry.replaying = true;
            entry.term.write(msg.data, () => { entry.replaying = false; });
          } else {
            entry.term.write(msg.data);
          }
        } else if (msg.t === "focus") {
          focusTab(msg.id);
        }
      };
      ws.onclose = () => {
        status.textContent = "disconnected, retrying…";
        for (const id of [...tabs.keys()]) removeTab(id);
        setTimeout(connect, 1500);
      };
    }

    // Only one page sends input to the shells (see server.js): the one you use takes over.
    for (const type of ["keydown", "mousedown", "focus"]) {
      window.addEventListener(type, () => sendMsg({ t: "claim" }), true);
    }

    new ResizeObserver(() => active && resize(active)).observe(container);
    connect();
  </script>
</body>
</html>
