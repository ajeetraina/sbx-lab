<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Terminal preview</title>
  <style>
    /* The terminal pane of the simulated lab (simspace/) */
    :root { --bg: #0d1117; --fg: #d1d5da; --dim: #6e7681; --accent: #5b86ff; --ok: #6db88a; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
    body { font: 13.5px/1.5 ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; padding: 12px 14px; box-sizing: border-box; overflow-y: auto; }
    .note { font-family: Inter, system-ui, sans-serif; color: #adbac7; border: 1px solid #30363d; border-radius: 8px; padding: 12px 14px; margin-bottom: 16px; max-width: 70ch; }
    .note strong { color: var(--fg); }
    .note code { background: #161b22; padding: 1px 5px; border-radius: 4px; color: var(--fg); }
    .entry { margin: 0 0 12px; white-space: pre-wrap; word-break: break-word; }
    .label { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
    .prompt { color: var(--accent); user-select: none; }
    .saved { color: var(--ok); }
    #empty { color: var(--dim); }
  </style>
</head>
<body>
  <div class="note">
    <strong>Preview: nothing runs here.</strong> The <em>Run</em> and <em>Save</em> buttons show below what they
    would do. To run the lab's commands in a terminal on your machine, clone the repository and start
    <code>./labspace-local/start.sh</code>.
  </div>
  <div id="log"><p id="empty">Click a Run button in the instructions.</p></div>
  <script>
    const log = document.getElementById("log");
    window.addEventListener("message", (event) => {
      if (event.origin !== location.origin || event.data?.source !== "labspace-static") return;
      const { kind, code, meta = {} } = event.data;
      document.getElementById("empty")?.remove();

      const entry = document.createElement("div");
      entry.className = "entry";
      const label = document.createElement("div");
      label.className = "label";
      const body = document.createElement("div");

      if (kind === "save") {
        label.textContent = `Save ${meta["save-as"] || "file"}`;
        body.textContent = code;
        body.className = "saved";
      } else {
        label.textContent = meta["terminal-id"] ? `Run in terminal "${meta["terminal-id"]}"` : "Run";
        code.split("\n").forEach((line, i) => {
          if (i) body.append("\n");
          const prompt = document.createElement("span");
          prompt.className = "prompt";
          prompt.textContent = i ? "> " : "$ ";
          body.append(prompt, line);
        });
      }
      entry.append(label, body);
      log.append(entry);
      entry.scrollIntoView({ block: "end" });
    });
  </script>
</body>
</html>
