name: pages

# Publishes the repository's GitHub Pages site, which holds both web versions of the lab:
#   /           the simulated lab (simspace/), as dockersamples/simspace's deploy-lab.yml builds it
#   /labspace/  the static preview of the Labspace rendering (labspace-local/static)
# A repository has a single Pages site, so the two are built into one artifact here, instead of
# two workflows each replacing the other's site. Enable Pages first: Settings → Pages → Source:
# "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - "simspace/**"
      - "instructions/**"
      - "labspace-local/static/**"
      - "labspace-local/content.mjs"
      - "labspace-local/theme.css"
      - "labspace-local/labspace-ui.js"
      - ".github/workflows/pages.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Same defaults as dockersamples/simspace's deploy-lab.yml
  LABS_DIR: simspace/labs
  SIMSPACE_RUNTIME_IMAGE: dockersamples/simspace
  SIMSPACE_AUTHORING_IMAGE: dockersamples/simspace-authoring
  # "latest" tracks the newest runtime; pin to a released version (e.g. "1") for stability.
  SIMSPACE_TAG: latest

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ---- / : the simulated lab (the steps of deploy-lab.yml)
      - name: Validate the simulated lab
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/$LABS_DIR:/labs:ro" \
            "$SIMSPACE_AUTHORING_IMAGE:$SIMSPACE_TAG" \
            npm run validate-lab -- /labs
      - name: Assemble the simulated lab (runtime payload + labs + catalog)
        run: |
          set -euo pipefail
          image="$SIMSPACE_RUNTIME_IMAGE:$SIMSPACE_TAG"
          docker pull "$image"
          cid="$(docker create "$image")"
          mkdir -p _site
          docker cp "$cid":/usr/share/nginx/html/. _site/
          docker rm "$cid"
          rm -rf _site/labs _site/labs.json
          mkdir -p _site/labs
          cp -R "$LABS_DIR/." _site/labs/
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            "$SIMSPACE_AUTHORING_IMAGE:$SIMSPACE_TAG" \
            npm run generate-catalog -- "/work/$LABS_DIR" /work/_site/labs.json
          # The runtime ships a dev config.json (localhost tracking): no tracking, no title here
          rm -f _site/config.json
          # The simulated lab's service worker caches every page and file under its scope, the
          # whole site: keep it off the Labspace preview, which would otherwise stay on the
          # version a visitor first saw.
          anchor='if (url.origin !== self.location.origin) return;'
          grep -qF "$anchor" _site/sw.js || { echo "::error::sw.js changed: update the labspace/ exclusion"; exit 1; }
          sed -i "s|$anchor|$anchor\n  if (url.pathname.startsWith(new URL(\"labspace/\", self.registration.scope).pathname)) return;|" _site/sw.js
          grep -q 'URL("labspace/"' _site/sw.js

      # ---- /labspace/ : the static preview of the Labspace rendering
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build the Labspace preview
        run: node labspace-local/static/build.mjs --base "/${{ github.event.repository.name }}/labspace/" --out _site/labspace

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
