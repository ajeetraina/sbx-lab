name: simspace-deploy

# Validates the simulated lab in simspace/ and publishes it to GitHub Pages on every
# push to main that changes simspace/. All the work lives in the reusable workflow in
# dockersamples/simspace (see dockersamples/simspace-starter). Enable Pages first:
# Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ["simspace/**", ".github/workflows/simspace-deploy.yaml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    uses: dockersamples/simspace/.github/workflows/deploy-lab.yml@main
    with:
      labs-dir: simspace/labs
      # "latest" tracks the newest runtime; pin to a released version (e.g. "1") for stability.
      runtime-tag: "latest"
