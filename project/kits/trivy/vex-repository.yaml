# Where Trivy reads VEX statements when it scans with `--vex repo`: Trivy's VEX Hub,
# and the advisories of Docker Hardened Images, which mark the CVEs that don't
# affect each image. From https://docs.docker.com/dhi/how-to/scan/.
repositories:
  - name: default
    url: https://github.com/aquasecurity/vexhub
    enabled: true
  - name: dhi-vex
    url: https://github.com/docker-hardened-images/advisories
    enabled: true
