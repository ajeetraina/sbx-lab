# syntax=docker/sandbox-kit:3
# Adapted from the trivy kit of docker/sbx-kits-contrib (v3 branch, Apache-2.0):
# https://github.com/docker/sbx-kits-contrib/tree/v3/trivy
# Changes: shorter comments, no agent-context capability, VEX repositories for
# Docker Hardened Images.
schemaVersion: "3"
kind: workload
displayName: Trivy
description: Aqua's open source vulnerability scanner, in its own sandbox
sourceUrl: https://github.com/aquasecurity/trivy

# What this kit installs. Keep in step with TRIVY_VERSION in trivy.dockerfile.
provides: ["trivy@0.70.0"]

capabilities:
  # A shell sandbox: sbx starts the image's entrypoint (a login shell) as the
  # agent user, with the workspace as the working directory.
  - type: com.docker.sandbox/sbx@1

  # Trivy is installed when the kit is built (see trivy.dockerfile), so the
  # sandbox never downloads it. At runtime it reaches the vulnerability
  # database (mirror.gcr.io first, ghcr.io as the fallback, and GHCR's blob
  # storage), and the GitHub hosts that serve the VEX repositories listed in
  # vex-repository.yaml.
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - mirror.gcr.io
          - ghcr.io
          - pkg-containers.githubusercontent.com
          - github.com
          - api.github.com
          - codeload.github.com
          - raw.githubusercontent.com
